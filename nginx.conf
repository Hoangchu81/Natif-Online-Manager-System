upstream backend { server 127.0.0.1:3001; }
upstream frontend { server 127.0.0.1:3000; }
server {
    server_name oms.techfair.vn;
    location / { proxy_pass http://frontend; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection 'upgrade'; proxy_set_header Host $host; proxy_cache_bypass $http_upgrade; }
    location /api/ { proxy_pass http://backend; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/oms.techfair.vn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/oms.techfair.vn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = oms.techfair.vn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name oms.techfair.vn;
    return 404; # managed by Certbot


}
