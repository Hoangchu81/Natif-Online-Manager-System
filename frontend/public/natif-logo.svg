<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6FD33D"/>
      <stop offset="100%" stop-color="#00C9FF"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f3892"/>
      <stop offset="100%" stop-color="#2B5FCD"/>
    </linearGradient>
  </defs>

  <!-- White background for visibility on dark themes -->
  <rect width="600" height="400" fill="white" rx="0"/>

  <!-- Orbit ellipse -->
  <ellipse cx="290" cy="175" rx="210" ry="110"
    fill="none"
    stroke="url(#orbitGrad)"
    stroke-width="2"
    transform="rotate(-15, 290, 175)"
    opacity="0.85"/>

  <!-- Electron / planet on orbit (upper right) -->
  <circle cx="490" cy="115" r="14" fill="#00C9FF" opacity="0.95"/>

  <!-- NATIF text -->
  <text x="300" y="145"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif"
    font-weight="900"
    font-size="88"
    fill="url(#textGrad)"
    letter-spacing="6">NATIF</text>

  <!-- Vietnamese full name -->
  <text x="300" y="205"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', 'Arial', sans-serif"
    font-weight="600"
    font-size="15"
    fill="#00C9FF"
    letter-spacing="2">QUỸ ĐỔI MỚI CÔNG NGHỆ QUỐC GIA</text>
</svg>
